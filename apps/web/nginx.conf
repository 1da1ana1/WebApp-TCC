# Nginx — serve a SPA Vue e faz proxy reverso de /api para a API NestJS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão básica dos assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: /api/* → http://api:3000/* (a barra final remove o prefixo /api,
    # replicando o rewrite do proxy do Vite em desenvolvimento).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: history mode do Vue Router — qualquer rota desconhecida cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo dos assets versionados pelo Vite (hash no nome).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
