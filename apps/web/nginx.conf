# Nginx — serve a SPA Vue e faz proxy reverso de /api para a API NestJS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão básica dos assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: /api/* → http://api:3000/* (o $1 remove o prefixo /api, replicando
    # o rewrite do proxy do Vite em desenvolvimento).
    #
    # O upstream vem de uma variável de propósito: com hostname literal o Nginx
    # resolve o DNS uma única vez, na carga da config, e passa a servir 502 se o
    # container `api` for recriado com outro IP. Com `resolver` + variável ele
    # reresolve a cada 10s. Em troca, `proxy_pass` com variável não reescreve a
    # URI sozinho — daí o $1$is_args$args explícito.
    location ~ ^/api/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: history mode do Vue Router — qualquer rota desconhecida cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo dos assets versionados pelo Vite (hash no nome).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
